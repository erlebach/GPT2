model:
  _target_: experiments.lightning_module_adapter.GPTLMAdapter
  n_layer: 4
  n_head: 8
  n_embd: 1024
  n_blocks_per_super: 2

optimizer:
  _target_: torch.optim.AdamW
  params:
    lr: 0.001
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.e-8

# Alternative optimizer examples:
# optimizer:
#   _target_: torch.optim.SGD
#   params:
#     lr: 0.01
#     momentum: 0.9
#     weight_decay: 0.0001

# optimizer:
#   _target_: torch.optim.Adam
#   params:
#     lr: 0.0003
#     betas: [0.9, 0.999]

experiment:
  num_iterations: 5
  warmup_iterations: 2
  batch_sizes: [1, 16]
  sequence_lengths: [256]
  models:
    - name: "medium1024"
      n_layer: 4
      n_head: 8
      n_embd: 1024
      n_blocks_per_super: 2
    - name: "large2048"
      n_layer: 8
      n_head: 16
      n_embd: 2048
      n_blocks_per_super: 2
