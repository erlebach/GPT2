model:
  _target_: experiments.lightning_module_adapter.GPTLMAdapter
  n_layer: 4
  n_head: 8
  n_embd: 1024
  n_blocks_per_super: 2

optimizer:
  _target_: torch.optim.AdamW
  params:
    lr: 0.001
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.e-8

