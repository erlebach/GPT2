[project]
name = "nanogpt"
version = "0.1.0"
description = "Experiments with NanoGPT from Karpathy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beartype>=0.21.0",
    "datasets>=4.0.0",
    "einops>=0.8.1",
    "jaxtyping>=0.3.2",
    "lightning==2.6.0.dev20250713",
    #"lightning>=2.5.2",
    "matplotlib>=3.10.3",
    "pandas==2.2.3",
    #"pandas>=2.3.1",
    "pillow>=11.3.0",
    "setuptools>=80.9.0",
    "tiktoken>=0.9.0",
    "tokenizers==0.21.4.dev0",
    #"tokenizers>=0.21.2",
    "torch==2.8.0a0+5228986c39.nv25.5",
    #"torch>=2.7.1",
    "tqdm>=4.67.1",
    "transformers>=4.51.3,<4.54.0",
    #"transformers>=4.51.3",
    "wandb>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.json", "*.yaml", "*.yml"]

[project.scripts]
train-gpt2 = "scripts.train_gpt2:main"
train-super-gpt2 = "scripts.train_super_gpt2:main"
evaluate-models = "scripts.evaluate_models:main"

